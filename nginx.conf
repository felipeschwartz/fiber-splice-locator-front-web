server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App usa BrowserRouter (react-router-dom) — sem isso, recarregar ou
    # acessar direto uma rota como /ceos/5 devolve 404 do nginx em vez do app.
    location / {
        try_files $uri /index.html;
    }
}
